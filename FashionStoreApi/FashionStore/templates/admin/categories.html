{% extends "admin/base_site.html" %}

{% block content %}

<div class="container-fluid">
    <h2>Category Management</h2>

    <div class="card mt-3">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-tags"></i> Categories
            </h3>
        </div>

        <div class="card-body">

            <div class="d-flex justify-content-between mb-3">
                <input id="searchInput" class="form-control" style="max-width:400px" placeholder="Search category..."
                    oninput="searchCategories()">

                <button type="button" class="btn btn-success" onclick="openAddModal()">
                    <i class="fas fa-plus"></i>
                    Add Category
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Parent</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="categoryTable">
                        <tr>
                            <td colspan="5" class="text-center">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="prevBtn" type="button" class="btn btn-secondary btn-sm" onclick="previousPage()" disabled>
                    Previous
                </button>

                <span id="pageInfo">
                    Page 1 / 1
                </span>

                <button id="nextBtn" type="button" class="btn btn-primary btn-sm" onclick="nextPage()" disabled>
                    Next
                </button>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">
                    Add Category
                </h5>

                <button type="button" class="close" onclick="closeModal()">
                    <span>&times;</span>
                </button>
            </div>

            <form id="categoryForm">

                <div class="modal-body">

                    <div class="form-group">
                        <label>Name</label>

                        <input id="categoryName" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Parent Category</label>

                        <select id="categoryParent" class="form-control">
                            <option value="">
                                None
                            </option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-success" id="saveBtn">
                        Save
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script>

    const API = "/FashionStore/api/secure/admin/category/";

    let categories = [];
    let filteredCategories = [];
    let currentPage = 1;
    let totalPages = 1;
    let editId = null;

    const PAGE_SIZE = 10;

    function getCookie(name) {

        const cookie = document.cookie
            .split(";")
            .find(x => x.trim().startsWith(name + "="));

        return cookie
            ? decodeURIComponent(
                cookie.trim().substring(name.length + 1)
            )
            : null;
    }

    async function requestAPI(url, options = {}) {

        const headers = {
            ...(options.headers || {})
        };

        if (
            options.method &&
            options.method !== "GET"
        ) {

            const csrf = getCookie("csrftoken");

            if (csrf) {
                headers["X-CSRFToken"] = csrf;
            }
        }

        if (options.body) {
            headers["Content-Type"] = "application/json";
        }

        const response = await fetch(url, {
            ...options,
            credentials: "same-origin",
            headers
        });

        if (!response.ok) {

            const text = await response.text();

            throw new Error(
                `${response.status}: ${text}`
            );
        }

        const contentType =
            response.headers.get("content-type");

        if (
            contentType &&
            contentType.includes("application/json")
        ) {
            return response.json();
        }

        return {};
    }

    async function loadCategories() {

        const table =
            document.getElementById("categoryTable");

        table.innerHTML = `
        <tr>
            <td colspan="5" class="text-center">
                Loading...
            </td>
        </tr>
    `;

        try {

            const response = await fetch(API, {
                credentials: "same-origin"
            });

            if (!response.ok) {

                throw new Error(
                    `${response.status}: ${await response.text()}`
                );
            }

            const data = await response.json();

            categories =
                data.results || data;

            filteredCategories =
                [...categories];

            renderParentOptions();

            renderCategories();

        } catch (error) {

            console.error(error);

            table.innerHTML = `
            <tr>
                <td colspan="5"
                    class="text-center text-danger">
                    Failed to load categories.
                </td>
            </tr>
        `;
        }
    }

    function renderParentOptions() {

        const select =
            document.getElementById("categoryParent");

        select.innerHTML = `
        <option value="">
            None
        </option>
    `;

        categories
            .filter(category =>
                category.is_active === true &&
                category.id !== editId
            )
            .forEach(category => {

                const option =
                    document.createElement("option");

                option.value = category.id;
                option.textContent =
                    category.name;

                select.appendChild(option);
            });
    }

    function getParentName(parentId) {

        if (!parentId) {
            return "-";
        }

        const parent =
            categories.find(
                category =>
                    category.id === parentId
            );

        return parent
            ? parent.name
            : "-";
    }

    function renderCategories() {

        const table =
            document.getElementById("categoryTable");

        const start =
            (currentPage - 1) * PAGE_SIZE;

        const end =
            start + PAGE_SIZE;

        const pageData =
            filteredCategories.slice(start, end);

        totalPages =
            Math.ceil(
                filteredCategories.length /
                PAGE_SIZE
            ) || 1;

        if (currentPage > totalPages) {
            currentPage = totalPages;
        }

        if (!pageData.length) {

            table.innerHTML = `
            <tr>
                <td colspan="5"
                    class="text-center">
                    No categories found.
                </td>
            </tr>
        `;

        } else {

            table.innerHTML =
                pageData.map(category => {

                    const active =
                        category.is_active === true;

                    return `
                    <tr>

                        <td>
                            ${category.id}
                        </td>

                        <td>
                            ${category.name || "-"}
                        </td>

                        <td>
                            ${getParentName(
                        category.parent_id
                    )}
                        </td>

                        <td>
                            ${active
                            ? `
                                        <span class="badge badge-success">
                                            Active
                                        </span>
                                    `
                            : `
                                        <span class="badge badge-danger">
                                            Inactive
                                        </span>
                                    `
                        }
                        </td>

                        <td>
                            ${active
                            ? `
                                        <button
                                            type="button"
                                            class="btn btn-sm btn-primary"
                                            onclick="editCategory(${category.id})"
                                        >
                                            <i class="fas fa-edit"></i>
                                            Edit
                                        </button>

                                        <button
                                            type="button"
                                            class="btn btn-sm btn-danger"
                                            onclick="deleteCategory(${category.id})"
                                        >
                                            <i class="fas fa-trash"></i>
                                            Delete
                                        </button>
                                    `
                            : `
                                        <span class="text-muted">
                                            -
                                        </span>
                                    `
                        }
                        </td>

                    </tr>
                `;

                }).join("");
        }

        document.getElementById("pageInfo").innerText =
            `Page ${currentPage} / ${totalPages}`;

        document.getElementById("prevBtn").disabled =
            currentPage <= 1;

        document.getElementById("nextBtn").disabled =
            currentPage >= totalPages;
    }

    function searchCategories() {

        const keyword =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

        filteredCategories =
            categories.filter(category => {

                const parentName =
                    getParentName(
                        category.parent_id
                    );

                const text = `
                ${category.name || ""}
                ${parentName}
            `.toLowerCase();

                return text.includes(keyword);
            });

        currentPage = 1;

        renderCategories();
    }

    function nextPage() {

        if (currentPage < totalPages) {

            currentPage++;

            renderCategories();
        }
    }

    function previousPage() {

        if (currentPage > 1) {

            currentPage--;

            renderCategories();
        }
    }

    function openAddModal() {

        editId = null;

        document.getElementById("modalTitle").innerText =
            "Add Category";

        document.getElementById("categoryForm").reset();

        renderParentOptions();

        $("#categoryModal").modal("show");
    }

    function closeModal() {

        $("#categoryModal").modal("hide");
    }

    function editCategory(id) {

        const category =
            categories.find(
                item => item.id === id
            );

        if (!category) {
            return;
        }

        editId = id;

        document.getElementById("modalTitle").innerText =
            "Edit Category";

        document.getElementById("categoryName").value =
            category.name || "";

        renderParentOptions();

        document.getElementById("categoryParent").value =
            category.parent_id || "";

        $("#categoryModal").modal("show");
    }

    document
        .getElementById("categoryForm")
        .addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                const name =
                    document
                        .getElementById("categoryName")
                        .value
                        .trim();

                const parent =
                    document
                        .getElementById("categoryParent")
                        .value;

                const button =
                    document.getElementById("saveBtn");

                const data = {
                    name: name,
                    parent_id: parent
                        ? Number(parent)
                        : null
                };

                button.disabled = true;

                button.innerText =
                    editId
                        ? "Updating..."
                        : "Creating...";

                try {

                    if (editId) {

                        await requestAPI(
                            `${API}${editId}/`,
                            {
                                method: "PATCH",
                                body: JSON.stringify(data)
                            }
                        );

                        alert(
                            "Category updated successfully!"
                        );

                    } else {

                        await requestAPI(
                            API,
                            {
                                method: "POST",
                                body: JSON.stringify(data)
                            }
                        );

                        alert(
                            "Category created successfully!"
                        );
                    }

                    closeModal();

                    await loadCategories();

                } catch (error) {

                    console.error(error);

                    alert(
                        "Failed to save category."
                    );

                } finally {

                    button.disabled = false;

                    button.innerText = "Save";
                }
            }
        );

    async function deleteCategory(id) {

        const category =
            categories.find(
                item => item.id === id
            );

        if (!category) {
            return;
        }

        if (
            !confirm(
                `Are you sure you want to delete "${category.name}"?`
            )
        ) {
            return;
        }

        try {

            await requestAPI(
                `${API}${id}/`,
                {
                    method: "DELETE"
                }
            );

            alert(
                "Category deleted successfully!"
            );

            await loadCategories();

        } catch (error) {

            console.error(error);

            alert(
                "Failed to delete category."
            );
        }
    }

    loadCategories();

</script>

{% endblock %}
